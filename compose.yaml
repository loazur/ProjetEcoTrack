services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: etudiant
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etudiant -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reseau_interne

  worker:
    build:
      context: ./worker
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reseau_interne

  api:
    build:
      context: ./api
    ports:
      - "5000:5000"
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: etudiant
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_HOST: db
      WORKER_URL: http://worker:8000
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reseau_interne
      - reseau_public

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - reseau_public

networks:
  reseau_interne:
    internal: true
  reseau_public:

volumes:
  pg_data:

secrets:
  db_password:
    file: ./db_password.txt
